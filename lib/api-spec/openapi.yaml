openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SRS Invoice Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client/buyer management
  - name: invoices
    description: Invoice management
  - name: panels
    description: Panel master (name, component breakdown, size, price)
  - name: tech-spec-items
    description: Technical specification master (item name / default spec pairs)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /panels:
    get:
      operationId: listPanels
      tags: [panels]
      summary: List all panels
      responses:
        "200":
          description: List of panels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Panel"
    post:
      operationId: createPanel
      tags: [panels]
      summary: Create a panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"

  /panels/{id}:
    get:
      operationId: getPanel
      tags: [panels]
      summary: Get a panel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePanel
      tags: [panels]
      summary: Update a panel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePanel
      tags: [panels]
      summary: Delete a panel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tech-spec-items:
    get:
      operationId: listTechSpecItems
      tags: [tech-spec-items]
      summary: List all tech spec master items
      responses:
        "200":
          description: List of tech spec items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechSpecItem"
    post:
      operationId: createTechSpecItem
      tags: [tech-spec-items]
      summary: Create a tech spec item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechSpecItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechSpecItem"

  /tech-spec-items/{id}:
    get:
      operationId: getTechSpecItem
      tags: [tech-spec-items]
      summary: Get a tech spec item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tech spec item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechSpecItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTechSpecItem
      tags: [tech-spec-items]
      summary: Update a tech spec item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechSpecItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechSpecItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTechSpecItem
      tags: [tech-spec-items]
      summary: Delete a tech spec item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Get invoice statistics for dashboard
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceStats"

  /invoices/recent:
    get:
      operationId: getRecentInvoices
      tags: [invoices]
      summary: Get 5 most recent invoices
      responses:
        "200":
          description: Recent invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"

  /invoices/next-number:
    get:
      operationId: getNextInvoiceNumber
      tags: [invoices]
      summary: Get the next invoice number
      responses:
        "200":
          description: Next invoice number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextInvoiceNumber"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice with items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get a full invoice with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Client:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        gstin:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        createdAt:
          type: string

    ClientInput:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        gstin:
          type: string
        phone:
          type: string
        email:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
        gstin:
          type: string
        phone:
          type: string
        email:
          type: string

    Panel:
      type: object
      required: [id, name, breakdownText, panelSize, price, defaultQty]
      properties:
        id:
          type: integer
        name:
          type: string
        breakdownText:
          type: string
        panelSize:
          type: string
        price:
          type: number
        defaultQty:
          type: integer
        createdAt:
          type: string

    PanelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        breakdownText:
          type: string
        panelSize:
          type: string
        price:
          type: number
          minimum: 0
        defaultQty:
          type: integer
          minimum: 1

    PanelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        breakdownText:
          type: string
        panelSize:
          type: string
        price:
          type: number
          minimum: 0
        defaultQty:
          type: integer
          minimum: 1

    TechSpecItem:
      type: object
      required: [id, itemName, defaultSpec]
      properties:
        id:
          type: integer
        itemName:
          type: string
        defaultSpec:
          type: string
        createdAt:
          type: string

    TechSpecItemInput:
      type: object
      required: [itemName, defaultSpec]
      properties:
        itemName:
          type: string
          minLength: 1
        defaultSpec:
          type: string
          minLength: 1

    TechSpecItemUpdate:
      type: object
      properties:
        itemName:
          type: string
          minLength: 1
        defaultSpec:
          type: string
          minLength: 1

    InvoiceItem:
      type: object
      required: [id, invoiceId, sNo, description, amount]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        sNo:
          type: integer
        description:
          type: string
        hsnSac:
          type: ["string", "null"]
        qty:
          type: ["number", "null"]
        rate:
          type: ["number", "null"]
        per:
          type: ["string", "null"]
        amount:
          type: number

    InvoiceItemInput:
      type: object
      required: [sNo, description, amount]
      properties:
        sNo:
          type: integer
        description:
          type: string
          minLength: 1
        hsnSac:
          type: string
        qty:
          type: number
        rate:
          type: number
        per:
          type: string
        amount:
          type: number

    Invoice:
      type: object
      required: [id, invoiceNo, date, clientId, client, items, subtotal, cgstRate, sgstRate, cgstAmount, sgstAmount, roundOff, netTotal, amountInWords, createdAt]
      properties:
        id:
          type: integer
        invoiceNo:
          type: integer
        date:
          type: string
        clientId:
          type: integer
        client:
          $ref: "#/components/schemas/Client"
        workSite:
          type: ["string", "null"]
        deliveryNote:
          type: ["string", "null"]
        modeOfPayment:
          type: ["string", "null"]
        suppliersRef:
          type: ["string", "null"]
        othersRef:
          type: ["string", "null"]
        buyersOrderNo:
          type: ["string", "null"]
        buyersOrderDate:
          type: ["string", "null"]
        despatchDocNo:
          type: ["string", "null"]
        despatchDocDate:
          type: ["string", "null"]
        despatchedThrough:
          type: ["string", "null"]
        destination:
          type: ["string", "null"]
        termsOfDelivery:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
        subtotal:
          type: number
        cgstRate:
          type: number
        sgstRate:
          type: number
        cgstAmount:
          type: number
        sgstAmount:
          type: number
        roundOff:
          type: number
        netTotal:
          type: number
        amountInWords:
          type: string
        createdAt:
          type: string

    InvoiceInput:
      type: object
      required: [invoiceNo, date, clientId, items, cgstRate, sgstRate]
      properties:
        invoiceNo:
          type: integer
        date:
          type: string
        clientId:
          type: integer
        workSite:
          type: string
        deliveryNote:
          type: string
        modeOfPayment:
          type: string
        suppliersRef:
          type: string
        othersRef:
          type: string
        buyersOrderNo:
          type: string
        buyersOrderDate:
          type: string
        despatchDocNo:
          type: string
        despatchDocDate:
          type: string
        despatchedThrough:
          type: string
        destination:
          type: string
        termsOfDelivery:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemInput"
        cgstRate:
          type: number
        sgstRate:
          type: number

    InvoiceUpdate:
      type: object
      properties:
        date:
          type: string
        clientId:
          type: integer
        workSite:
          type: string
        deliveryNote:
          type: string
        modeOfPayment:
          type: string
        suppliersRef:
          type: string
        othersRef:
          type: string
        buyersOrderNo:
          type: string
        buyersOrderDate:
          type: string
        despatchDocNo:
          type: string
        despatchDocDate:
          type: string
        despatchedThrough:
          type: string
        destination:
          type: string
        termsOfDelivery:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemInput"
        cgstRate:
          type: number
        sgstRate:
          type: number

    InvoiceSummary:
      type: object
      required: [id, invoiceNo, date, clientId, clientName, netTotal, createdAt]
      properties:
        id:
          type: integer
        invoiceNo:
          type: integer
        date:
          type: string
        clientId:
          type: integer
        clientName:
          type: string
        workSite:
          type: ["string", "null"]
        netTotal:
          type: number
        createdAt:
          type: string

    InvoiceStats:
      type: object
      required: [totalInvoices, totalRevenue, thisMonthRevenue, thisMonthCount, lastMonthRevenue, lastMonthCount]
      properties:
        totalInvoices:
          type: integer
        totalRevenue:
          type: number
        thisMonthRevenue:
          type: number
        thisMonthCount:
          type: integer
        lastMonthRevenue:
          type: number
        lastMonthCount:
          type: integer

    NextInvoiceNumber:
      type: object
      required: [nextNumber]
      properties:
        nextNumber:
          type: integer
