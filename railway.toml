[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm@11.17.0 && pnpm install --no-frozen-lockfile && node /app/artifacts/api-server/build.mjs"

[deploy]
startCommand = "node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3